name: Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: acrmlopsedna.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t acrmlopsedna.azurecr.io/api-kaggle-clientes:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push acrmlopsedna.azurecr.io/api-kaggle-clientes:${{ github.sha }}
